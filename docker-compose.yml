# Local PostgreSQL without installing anything:  docker compose up -d
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: portal, POSTGRES_PASSWORD: portal, POSTGRES_DB: phportal }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes: { pgdata: {} }
# .env ->  DATABASE_URL=postgres://portal:portal@localhost:5432/phportal
